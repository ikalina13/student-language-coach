appId: ph.slc.app
productName: Student Language Coach
copyright: Student Language Coach
compression: maximum
electronLanguages:
  - en-US
directories:
  output: dist
  buildResources: build
files:
  - app/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Student-Language-Coach-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Student Language Coach
  deleteAppDataOnUninstall: false
publish:
  provider: github
  releaseType: release
